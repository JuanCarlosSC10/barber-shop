<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Porte Fino - Servicio exclusivo de barbería, perfilado de barba y cortes clásicos urbanos.">
    <title>Porte Fino | Barberia</title>
    <link rel="icon" type="image/svg+xml" href="assets/svg/icon.svg">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="cabecera-principal">
    <div class="contenedor-nav">
        <a href="index.html" class="marca-logo" aria-label="Inicio Porte Fino">
            <img src="assets/svg/icon_barb.svg " alt="Icono Barbería" class="icono-cabecera">
            <img src="assets/img/logoPonteFino.png" alt="Logo Porte Fino Barber Club" class="logo-cabecera">
        </a>
        <nav aria-label="Navegación principal">
            <ul class="menu-lista">
                <li><a href="index.html" class="menu-enlace menu-enlace-activo">Inicio</a></li>
                <li><a href="servicios.html" class="menu-enlace">Servicios</a></li>
                <li><a href="nosotros.html" class="menu-enlace">Nosotros</a></li>
                <li><a href="contacto.html" class="menu-enlace">Reservas</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main>
        <section class="hero-contenedor">
            <picture>
                <source media="(min-width: 64rem)" srcset="assets/img/LocalPorteFino.jpeg">
                <source media="(min-width: 40rem)" srcset="assets/img/barber.jpg">
                <img src="assets/img/corteTradicional.jpg" alt="corte tradicional" class="hero-imagen">
            </picture>
            <div class="hero-superposicion">
                <h1 class="hero-titulo">Estilo & Precisión</h1>
                <p class="hero-subtitulo">Desde un corte clásico hasta un estilo más moderno, ponemos dedicación a cada servicio.</p>
                <a href="contacto.html" class="boton-primario">Agendar Cita</a>
            </div>
        </section>

        <section class="seccion-contenedor">
            <header class="seccion-encabezado">
                <h2 class="seccion-titulo">Especialidades</h2>
                <div class="seccion-divisor"></div>
            </header>

            <div class="grid-tarjetas">
                <figure class="tarjeta-figura">
                    <div class="tarjeta-imagen-wrapper">
                        <img src="assets/img/relajacion.jpg" alt="Cliente recibiendo un corte estilo Skin Fade" class="tarjeta-imagen">
                    </div>
                    <figcaption class="tarjeta-pie">
                        <h3 class="tarjeta-titulo">Skin Fade Urbano</h3>
                        <p class="tarjeta-descripcion">Degradado milimétrico ejecutado a navaja libre con pulido de contornos.</p>
                    </figcaption>
                </figure>

                <figure class="tarjeta-figura">
                    <div class="tarjeta-imagen-wrapper">
                        <img src="assets/img/CorteEstilo.jpg" alt="Tratamiento de rostro con toalla caliente" class="tarjeta-imagen">
                    </div>
                    <figcaption class="tarjeta-pie">
                        <h3 class="tarjeta-titulo">Ritual de Relajacion</h3>
                        <p class="tarjeta-descripcion">Acondicionamiento con aceites esenciales, toalla caliente y skin-care.</p>
                    </figcaption>
                </figure>

                <figure class="tarjeta-figura">
                    <div class="tarjeta-imagen-wrapper">
                        <img src="assets/img/AtencionPersonalizada.jpg" alt="Herramientas tradicionales de corte y navajas" class="tarjeta-imagen">
                    </div>
                    <figcaption class="tarjeta-pie">
                        <h3 class="tarjeta-titulo">Corte Ejecutivo</h3>
                        <p class="tarjeta-descripcion">Modelado a tijera tradicional adaptado a la morfología facial del cliente.</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>&copy; 2026 Porte Fino. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
